name: tabdat
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # Core TabDAT model and file-free regression tests. Add baseline and
      # evaluation dependencies only when those workflows are in scope.
      - torch==2.7.0
      - numpy==1.26.4
      - pandas==2.2.3
      - scipy==1.11.4
      - scikit-learn==1.6.1
      - six==1.17.0
      # Current lightweight statistical evaluation and legacy dython compatibility.
      - setuptools==78.1.1
      - dython==0.6.4.post1
      - matplotlib==3.10.0
      - seaborn==0.13.2
      # Optional quality metrics are not part of this core environment.
      # If installing sdmetrics/synthcity separately, resolve transitive
      # dependencies and run `python -m pip check` before using --extra.
      # synthcity==0.2.12 declares torch<2.3 and networkx<3, unlike this env.
      # Do not treat these quality metrics as DP guarantees.
